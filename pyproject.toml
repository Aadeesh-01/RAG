[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coderag"
version = "0.1.0"
description = "Code-aware RAG over Python repositories: AST chunking, structural metadata and multi-hop call-graph retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    "transformers>=4.56",
    "torch>=2.2",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "pyyaml>=6"]
dev = ["pytest>=8", "pyyaml>=6", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
coderag = "coderag.cli:main"

[tool.setuptools]
packages = ["coderag", "coderag.web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
