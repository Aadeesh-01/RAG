[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coderag"
version = "0.1.0"
description = "Code-aware RAG over Python repositories: AST chunking, structural metadata and multi-hop call-graph retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    "transformers>=4.56",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
coderag = "coderag.cli:main"

[tool.setuptools]
packages = ["coderag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
