[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coderag"
version = "0.1.0"
description = "Code-aware RAG over Python repositories: AST chunking, structural metadata and multi-hop call-graph retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    "transformers>=4.56",
    "torch>=2.2",
    "tree-sitter-language-pack==1.25.2",   # v9: non-Python languages (grammars download on first use)
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "pyyaml>=6", "httpx>=0.27", "itsdangerous>=2.1", "cryptography>=42",
       "sqlalchemy>=2.0,<2.1", "alembic>=1.13", "psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pyyaml>=6", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29", "itsdangerous>=2.1", "cryptography>=42",
       "sqlalchemy>=2.0,<2.1", "alembic>=1.13", "psycopg[binary]>=3.1", "playwright>=1.44"]

[project.scripts]
coderag = "coderag.cli:main"

[tool.setuptools]
packages = ["coderag", "coderag.web", "coderag.bridges", "coderag.db", "coderag.db.migrations",
            "coderag.db.migrations.versions"]

[tool.setuptools.package-data]
"coderag.db.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
