name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4          # the frontend's tests (node --test, run by pytest)
        with:
          node-version: "20"
      - name: Install (locked, CPU-only torch)
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
          pip install "pytest>=8"
      - name: Tests
        run: pytest -q

  # Builds and smoke-tests the image on every push and PR. Only a push to main
  # publishes it, as ghcr.io/<owner>/coderag:sha-<short> and :latest (the image
  # that passed the smoke test and the secret scan is the one pushed).
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                      # GHCR push with GITHUB_TOKEN (main only)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5      # lowercases the owner; adds the OCI source label
        with:
          images: ghcr.io/${{ github.repository_owner }}/coderag
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            coderag:ci
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (SQLite, no secrets)
        run: |
          docker run -d --name coderag -p 7860:7860 -e CODERAG_PUBLIC_URL=http://localhost:7860 coderag:ci
          for i in $(seq 1 60); do curl -fs http://localhost:7860/api/ready && break; sleep 2; done
          curl -fs http://localhost:7860/api/ready
          curl -fs -o /dev/null http://localhost:7860/app
          docker image ls coderag:ci --format 'image size: {{.Size}}'
      - name: No secrets in the image
        run: python3 scripts/scan_image.py coderag:ci
      - name: Logs
        if: always()
        run: docker logs coderag || true
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do docker push "$tag"; done
          echo "pushed: $(echo $TAGS)" >> "$GITHUB_STEP_SUMMARY"
